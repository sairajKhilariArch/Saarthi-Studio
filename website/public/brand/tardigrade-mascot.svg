<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 240"
  role="img"
  aria-label="Sarthi Studio mascot — a happy tardigrade waving"
  class="logo-mascot"
>
  <title>Sarthi Studio mascot</title>
  <desc>A cheerful orange tardigrade with big bright eyes, a wide open smile, and one arm waving hello.</desc>

  <ellipse cx="120" cy="225" rx="74" ry="9" fill="#111111" opacity="0.12" />

  <g class="mover">
    <!-- Four stubby feet, with claws -->
    <g fill="#FF7A1A" stroke="#111111" stroke-width="3">
      <ellipse cx="86" cy="214" rx="17" ry="14" />
      <ellipse cx="154" cy="214" rx="17" ry="14" />
      <ellipse cx="110" cy="219" rx="13" ry="11" />
      <ellipse cx="130" cy="219" rx="13" ry="11" />
    </g>
    <g fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round">
      <path d="M78 224v5M86 226v5M94 224v5" />
      <path d="M146 224v5M154 226v5M162 224v5" />
    </g>

    <!-- Torso -->
    <rect x="58" y="124" width="124" height="98" rx="40" fill="#FF7A1A" stroke="#111111" stroke-width="3" />

    <!-- Belly patch -->
    <rect x="88" y="158" width="64" height="46" rx="23" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />

    <!-- Segment seams -->
    <g fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" opacity="0.4">
      <path d="M62 160h16M162 160h16" />
      <path d="M62 188h16M162 188h16" />
    </g>

    <!-- Resting arm -->
    <path d="M70 158q-18 8-20 24" fill="none" stroke="#111111" stroke-width="17" stroke-linecap="round" />
    <path d="M70 158q-18 8-20 24" fill="none" stroke="#FF7A1A" stroke-width="12" stroke-linecap="round" />

    <!-- Waving arm -->
    <path d="M170 154q22-4 30-28" fill="none" stroke="#111111" stroke-width="17" stroke-linecap="round" />
    <path d="M170 154q22-4 30-28" fill="none" stroke="#FF7A1A" stroke-width="12" stroke-linecap="round" />
    <circle cx="202" cy="116" r="13" fill="#FF7A1A" stroke="#111111" stroke-width="3" />
    <g fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round">
      <path d="M194 106l-3-6M202 103v-7M210 106l3-6" />
    </g>
  </g>

  <g class="mover">
    <!-- Antennae -->
    <path d="M102 54Q84 40 76 30" fill="none" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <path d="M102 54Q84 40 76 30" fill="none" stroke="#FF7A1A" stroke-width="4" stroke-linecap="round" />
    <circle cx="72" cy="25" r="7" fill="#FF7A1A" stroke="#111111" stroke-width="2.5" />
    <path d="M138 54Q156 40 164 30" fill="none" stroke="#111111" stroke-width="8" stroke-linecap="round" />
    <path d="M138 54Q156 40 164 30" fill="none" stroke="#FF7A1A" stroke-width="4" stroke-linecap="round" />
    <circle cx="168" cy="25" r="7" fill="#FF7A1A" stroke="#111111" stroke-width="2.5" />
  </g>

  <g class="mover">
    <!-- Head -->
    <ellipse cx="120" cy="90" rx="52" ry="46" fill="#FF7A1A" stroke="#111111" stroke-width="3" />

    <!-- Happy eyebrows -->
    <path d="M82 62q14-11 28-3" fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />
    <path d="M158 62q-14-11-28-3" fill="none" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />

    <!-- Eyes -->
    <ellipse cx="98" cy="88" rx="17" ry="21" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <ellipse cx="142" cy="88" rx="17" ry="21" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
    <ellipse cx="98" cy="92" rx="8" ry="12" fill="#111111" />
    <ellipse cx="142" cy="92" rx="8" ry="12" fill="#111111" />
    <circle cx="102" cy="85" r="3.2" fill="#FFFFFF" />
    <circle cx="146" cy="85" r="3.2" fill="#FFFFFF" />

    <!-- Muzzle -->
    <ellipse cx="120" cy="117" rx="30" ry="19" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />

    <!-- Wide happy smile, teeth and tongue -->
    <path d="M104 112Q120 138 136 112Z" fill="#111111" />
    <path d="M107 113q13 8 26 0q-13 4-26 0Z" fill="#FFFFFF" />
    <ellipse cx="120" cy="127" rx="8" ry="4.5" fill="#FF7A1A" />
  </g>

  <!-- Sparkles -->
  <g fill="#FF7A1A" stroke="#111111" stroke-width="2.5" stroke-linejoin="round">
    <path d="M46 66l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" />
    <path d="M198 44l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" />
  </g>
</svg>
