<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 360"
  width="640"
  height="360"
  role="img"
  aria-label="Sarthi Studio — loading splash"
>
  <title>Sarthi Studio loading splash</title>
  <desc>The Sarthi Studio splash screen showing the mascot during app startup.</desc>
  <rect width="640" height="360" fill="#061111" />
  <rect width="640" height="360" rx="48" fill="none" stroke="#1c3a37" stroke-width="1" stroke-opacity="0.25" />
  <rect width="640" height="360" rx="48" fill="#112e2c" opacity="0.5" />

  <!-- Mascot, centered and gently loading (bouncing/pulsing) -->
  <g class="splash-mascot" style="animation-duration:3.4s;">
    <ellipse cx="120" cy="86" rx="46" ry="44" fill="#d97757" />
    <ellipse cx="120" cy="86" rx="46" ry="44" fill="none" stroke="#b4633f" stroke-width="1.5" stroke-opacity="0.35" />

    <ellipse cx="96" cy="88" rx="16" ry="21" fill="#f7f3ea" />
    <ellipse cx="144" cy="88" rx="16" ry="21" fill="#f7f3ea" />
    <ellipse cx="96" cy="93" rx="7.5" ry="13" fill="#2b1e16" />
    <ellipse cx="144" cy="93" rx="7.5" ry="13" fill="#2b1e16" />
    <ellipse cx="102" cy="80" rx="4.2" ry="6.2" fill="#ffffff" opacity="0.9" />
    <ellipse cx="150" cy="80" rx="4.2" ry="6.2" fill="#ffffff" opacity="0.9" />

    <ellipse cx="120" cy="114" rx="27" ry="14" fill="#f2e4d2" />
    <ellipse cx="120" cy="114" rx="27" ry="14" fill="none" stroke="#d97757" stroke-width="2.5" stroke-opacity="0.45" />
    <path d="M107 124 Q120 115 133 124" fill="none" stroke="#2b1e16" stroke-width="3.2" stroke-linecap="round" />

    <circle cx="84" cy="20" r="5.5" fill="#d97757" />
    <circle cx="156" cy="20" r="5.5" fill="#d97757" />

    <rect x="66" y="136" width="108" height="92" rx="34" fill="url(#bgGrad)" stroke="#b4633f" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="66" y1="172" x2="174" y2="172" stroke="#b4633f" stroke-width="2" stroke-opacity="0.32" stroke-dasharray="0 4 6 4" />
    <line x1="66" y1="202" x2="174" y2="202" stroke="#b4633f" stroke-width="2" stroke-opacity="0.32" stroke-dasharray="0 4 6 4" />

    <ellipse cx="92" cy="230" rx="14" ry="14" fill="#c4633f" />
    <ellipse cx="92" cy="240" rx="5.5" ry="4.5" fill="#8a4a28" />
    <ellipse cx="148" cy="230" rx="14" ry="14" fill="#c4633f" />
    <ellipse cx="148" cy="240" rx="5.5" ry="4.5" fill="#8a4a28" />
    <ellipse cx="114" cy="234" rx="11.5" ry="11" fill="#c4633f" />
    <ellipse cx="114" cy="242" rx="4.8" ry="4" fill="#8a4a28" />
    <ellipse cx="130" cy="234" rx="11.5" ry="11" fill="#c4633f" />
    <ellipse cx="130" cy="242" rx="4.8" ry="4" fill="#8a4a28" />

    <rect x="68" y="138" width="104" height="88" rx="34" fill="#061111" opacity="0.18" filter="url(#softShadow)" />
  </g>
  <defs>
    <linearGradient id="bgGrad" x1="0.3" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8947a" />
      <stop offset="1" stop-color="#d97757" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-8%" width="120%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#061111" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- App label -->
  <text
    x="320" y="300"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="46"
    fill="#f7f4ea"
    letter-spacing="-0.5"
    text-anchor="middle"
  >
    Sarthi Studio
  </text>
  <text
    x="320" y="332"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="16"
    fill="#9aa79f"
    letter-spacing="0"
    text-anchor="middle"
  >
    loading · a local-first AI workspace
  </text>
  <style>
    .splash-mascot {
      transform-box: fill-box;
      transform-origin: center;
      animation:
        logo-bob 3.2s ease-in-out infinite,
        logo-pulse 2.4s ease-in-out infinite;
    }
    @keyframes logo-bob {
      0%, 100% { transform: translateY(0) rotate(-1.2deg); }
      50%      { transform: translateY(-8px) rotate(1.4deg); }
    }
    @keyframes logo-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.05) opacity: 0.96; }
    }
  </style>
</svg>
