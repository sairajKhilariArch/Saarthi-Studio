<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-label="Sarthi Studio"
>
  <title>Sarthi Studio</title>
  <desc>A happy orange tardigrade face on a black tile.</desc>

  <rect width="512" height="512" rx="108" fill="#111111" />

  <!-- Antennae -->
  <path d="M190 150Q160 112 142 108" fill="none" stroke="#FF7A1A" stroke-width="20" stroke-linecap="round" />
  <path d="M322 150Q352 112 370 108" fill="none" stroke="#FF7A1A" stroke-width="20" stroke-linecap="round" />
  <circle cx="134" cy="102" r="22" fill="#FF7A1A" />
  <circle cx="378" cy="102" r="22" fill="#FF7A1A" />

  <!-- Head -->
  <ellipse cx="256" cy="268" rx="158" ry="150" fill="#FF7A1A" />

  <!-- Happy eyebrows -->
  <path d="M158 226q38-26 76-8" fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round" />
  <path d="M354 226q-38-26-76-8" fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="204" cy="276" rx="46" ry="58" fill="#FFFFFF" />
  <ellipse cx="308" cy="276" rx="46" ry="58" fill="#FFFFFF" />
  <ellipse cx="204" cy="286" rx="22" ry="34" fill="#111111" />
  <ellipse cx="308" cy="286" rx="22" ry="34" fill="#111111" />
  <circle cx="214" cy="264" r="9" fill="#FFFFFF" />
  <circle cx="318" cy="264" r="9" fill="#FFFFFF" />

  <!-- Muzzle and smile -->
  <ellipse cx="256" cy="354" rx="88" ry="56" fill="#FFFFFF" />
  <path d="M210 340Q256 400 302 340Z" fill="#111111" />
  <path d="M220 342q36 22 72 0q-36 12-72 0Z" fill="#FFFFFF" />
  <ellipse cx="256" cy="382" rx="22" ry="12" fill="#FF7A1A" />
</svg>
