name: VS Code Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build VS Code extension (.vsix)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install, typecheck, test, and package
        working-directory: vscode-extension
        run: |
          set -eu
          npm ci
          npx tsc --noEmit
          npm test
          mkdir -p ../dist
          npx vsce package --no-dependencies -o ../dist/free-ai-studio-vscode.vsix

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-studio-vscode
          path: dist/free-ai-studio-vscode.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Attach extension to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/free-ai-studio-vscode.vsix