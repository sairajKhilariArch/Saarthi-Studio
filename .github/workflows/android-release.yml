name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble release APK and AAB (R8, unsigned)
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Stage Android artifacts
        run: |
          set -eu
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/free-ai-studio-android-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/free-ai-studio-android-unsigned.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-studio-android
          path: |
            dist/free-ai-studio-android-unsigned.apk
            dist/free-ai-studio-android-unsigned.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach Android artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/free-ai-studio-android-unsigned.apk
            dist/free-ai-studio-android-unsigned.aab