name: Desktop Release

# Builds every desktop artifact: Linux x86_64 (portable tarball, .deb package
# via cargo-deb, AppImage) and Windows x86_64 (portable zip), plus the VS Code
# extension .vsix. Push a `v*` tag to build and attach all of them to one GitHub
# release; workflow_dispatch builds and uploads artifacts without a release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Linux release packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Read package version
        id: meta
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Build release binary and run tests
        working-directory: app
        run: |
          set -eu
          cargo build --release --locked
          cargo test --locked

      - name: Build portable tarball
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="free-ai-suite_${VERSION}_linux-x86_64"
          mkdir -p "dist/$STAGE/static"
          cp app/target/release/free-ai-studio "dist/$STAGE/free-ai-studio"
          cp app/static/index.html app/static/app.js app/static/styles.css "dist/$STAGE/static/"
          cp README.md "dist/$STAGE/"
          cp app/LICENSE "dist/$STAGE/LICENSE"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"

      - name: Build .deb package
        run: |
          set -eu
          cargo install cargo-deb --locked
          cd app
          cargo deb --locked
          cp target/debian/*.deb ../dist/

      - name: Build AppImage
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p AppDir/usr/bin AppDir/usr/share/free-ai-suite/static
          cp app/target/release/free-ai-studio AppDir/usr/bin/
          cp app/static/index.html app/static/app.js app/static/styles.css AppDir/usr/share/free-ai-suite/static/
          cp app/packaging/free-ai-suite.desktop AppDir/free-ai-suite.desktop
          cp app/packaging/icons/free-ai-suite.svg AppDir/free-ai-suite.svg
          # appimagetool does not generate AppRun; provide it explicitly so the
          # AppImage has an entry point that resolves usr/ relative to itself.
          ln -s usr/bin/free-ai-studio AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "dist/free-ai-suite_${VERSION}_x86_64.AppImage"

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-suite-linux-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  windows:
    name: Build Windows release package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # The repo pins nightly for -Z threads and the cranelift dev backend;
      # release builds only need a stable-enough compiler, but the pinned
      # toolchain keeps CI identical to local builds.
      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Read package version
        id: meta
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release binary and run tests
        working-directory: app
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $stage = "dist/free-ai-suite_${version}_windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/static" | Out-Null
          Copy-Item app/target/release/free-ai-studio.exe "$stage/free-ai-studio.exe"
          Copy-Item app/static/index.html, app/static/app.js, app/static/styles.css "$stage/static/"
          Copy-Item README.md, app/LICENSE "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/free-ai-suite_${version}_windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-suite-windows-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows artifact to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  vscode-extension:
    name: Build VS Code extension (.vsix)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install, typecheck, test, and package
        working-directory: vscode-extension
        run: |
          set -eu
          npm ci
          npx tsc --noEmit
          npm test
          mkdir -p ../dist
          npx vsce package --no-dependencies -o ../dist/free-ai-studio-vscode.vsix

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-studio-vscode
          path: dist/free-ai-studio-vscode.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Attach extension to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/free-ai-studio-vscode.vsix

  android:
    name: Build Android release APK and AAB (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # No signing key is committed, so these artifacts are unsigned and are
      # signed by the distributor before publishing to a store.
      - name: Assemble release APK and AAB (R8, unsigned)
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Stage Android artifacts
        run: |
          set -eu
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/free-ai-studio-android-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/free-ai-studio-android-unsigned.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-studio-android
          path: |
            dist/free-ai-studio-android-unsigned.apk
            dist/free-ai-studio-android-unsigned.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach Android artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/free-ai-studio-android-unsigned.apk
            dist/free-ai-studio-android-unsigned.aab
