name: Desktop Release

# Builds the Linux x86_64 release artifacts: portable tarball, .deb package
# (cargo-deb), and AppImage, each with a SHA-256 checksum. Push a `v*` tag to
# build and attach everything to a GitHub release; workflow_dispatch builds and
# uploads the artifacts without creating a release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Linux release packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Read package version
        id: meta
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Build release binary and run tests
        working-directory: app
        run: |
          set -eu
          cargo build --release --locked
          cargo test --locked

      - name: Build portable tarball
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="free-ai-suite_${VERSION}_linux-x86_64"
          mkdir -p "dist/$STAGE/static"
          cp app/target/release/free-ai-studio "dist/$STAGE/free-ai-studio"
          cp app/static/index.html app/static/app.js app/static/styles.css "dist/$STAGE/static/"
          cp README.md "dist/$STAGE/"
          cp app/LICENSE "dist/$STAGE/LICENSE"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"

      - name: Build .deb package
        run: |
          set -eu
          cargo install cargo-deb --locked
          cd app
          cargo deb --locked
          cp target/debian/*.deb ../dist/

      - name: Build AppImage
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p AppDir/usr/bin AppDir/usr/share/free-ai-suite/static
          cp app/target/release/free-ai-studio AppDir/usr/bin/
          cp app/static/index.html app/static/app.js app/static/styles.css AppDir/usr/share/free-ai-suite/static/
          cp app/packaging/free-ai-suite.desktop AppDir/free-ai-suite.desktop
          cp app/packaging/icons/free-ai-suite.svg AppDir/free-ai-suite.svg
          # appimagetool does not generate AppRun; provide it explicitly so the
          # AppImage has an entry point that resolves usr/ relative to itself.
          ln -s usr/bin/free-ai-studio AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "dist/free-ai-suite_${VERSION}_x86_64.AppImage"

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-suite-linux-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
