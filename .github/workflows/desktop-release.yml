name: Desktop Release

# Builds every release artifact: Linux x86_64 (portable tarball, .deb package
# via cargo-deb, AppImage), Windows x86_64 (portable zip and MSI installer),
# macOS universal
# arm64+x86_64 (portable tarball, unsigned, headless-smoked), the unsigned
# Android release APK/AAB, and the VS Code extension .vsix. A `v*` tag push, a
# published GitHub release, or a workflow_dispatch with a tag builds and
# attaches all of them. A dispatch with no tag builds artifacts only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach (must match app/Cargo.toml); leave blank to build artifacts only'
        required: false
        type: string
  push:
    tags:
      - 'v*'
  release:
    # Catch a release created through the API or UI without a tag-push event.
    # Releases made by this workflow's own GITHUB_TOKEN do not re-trigger it.
    types: [published]

permissions:
  contents: write

# Two tag pushes must never build the same release at once: assets are keyed by
# filename on a single release, so an overlapping run races the attachment.
concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    # One job decides what is being released before any package is built. A tag
    # is accepted only when its version is exactly the version in the checked
    # out manifest, so a stale tag can never receive a differently-versioned
    # binary. A dispatch with no tag remains an artifacts-only run.
    name: Verify release tag and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read and verify the version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          version="$(bash scripts/ci/version.sh app/Cargo.toml)"
          tag=""
          release="false"
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            release="true"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            release="true"
          fi
          if [ "$release" = "true" ]; then
            case "$tag" in
              v*) ;;
              *) echo "ERROR: a release tag must start with v: $tag" >&2; exit 1 ;;
            esac
            expected="${tag#v}"
            if [ "$version" != "$expected" ]; then
              echo "ERROR: tag $tag does not match app/Cargo.toml version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version; tag ${tag:-none}; release $release"

  deb:
    # The .deb is built headless (--no-default-features: no Tauri/GTK links)
    # on ubuntu-22.04, so cargo-deb's $auto resolves to glibc 2.35 and the
    # package installs on Ubuntu 22.04/Debian 12 — it refused with a 2.39
    # dependency when it was built from the GUI tree on ubuntu-latest. The
    # deb's desktop entry runs the server plus browser (no window needed);
    # windowed binaries ship as the tarball and AppImage below.
    name: Build portable .deb (Ubuntu 22.04+)
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      # .cargo/config.toml links with mold everywhere; without this binary the
      # 22.04 job died at the first build-script link (cannot find 'ld').
      # The headless tree still links keyring's Secret Service backend, whose
      # libdbus-sys build script probes pkg-config for dbus-1. The GUI jobs get
      # those headers through GTK; this job installs no Tauri dependencies, so
      # it must name them itself or the build panics before any test runs.
      - name: Install headless build dependencies
        run: sudo apt-get update && sudo apt-get install -y mold libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build headless binary and run tests
        working-directory: app
        run: |
          set -eu
          cargo build --release --locked --no-default-features
          cargo test --locked --no-default-features

      - name: Build .deb package
        run: |
          set -eu
          cargo install cargo-deb --locked
          cd app
          cargo deb --locked --no-build
          mkdir -p ../dist
          cp target/debian/*.deb ../dist/

      - name: Static-check the package (no GUI deps, full UI inside)
        run: |
          set -eu
          DEB=$(ls dist/*.deb | head -n1)
          depends=$(dpkg-deb -f "$DEB" Depends)
          echo "Depends: $depends"
          echo "$depends" | grep -Eq 'gtk|webkit' && { echo "ERROR: GUI dependency leaked into the headless deb"; exit 1; }
          dpkg-deb -c "$DEB" | grep -q usr/share/sarthi-studio/static/skills/debug/SKILL.md || { echo "ERROR: bundled skills missing from the deb"; exit 1; }
          dpkg-deb -c "$DEB"

      # Unpacked and booted here, not just inspected: a package that installs
      # but cannot start is exactly the failure this catches.
      - name: Smoke the installed package (unpack, boot, report version)
        run: bash scripts/ci/smoke-package.sh dist/*.deb

      # Reject control characters/spaces in names and verify checksums before
      # anything is handed to upload-artifact or the release API.
      - name: Validate artifact names
        run: bash scripts/ci/verify-artifacts.sh dist

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-studio-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Attach .deb to GitHub release
        if: needs.preflight.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: dist/*.deb

  release:
    name: Build Linux release packages
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      # The release build links Tauri (default "gui" feature): GTK and
      # webkit2gtk development libraries are required, and cargo deb's $auto
      # dependency detection needs the runtime libs present too.
      - name: Install Tauri system dependencies
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # One parser on every OS (scripts/ci/version.sh): it strips CR/LF/tab and
      # refuses an empty or malformed version. A raw CR here is what produced
      # unusable artifact filenames in the v1.26.0/v1.26.1 runs.
      - name: Read package version
        id: meta
        run: |
          set -eu
          version="$(bash scripts/ci/version.sh app/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary and run tests
        working-directory: app
        run: |
          set -eu
          cargo build --release --locked
          cargo test --locked

      - name: Build portable tarball
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="sarthi-studio_${VERSION}_linux-x86_64"
          mkdir -p "dist/$STAGE/static"
          cp app/target/release/free-ai-studio "dist/$STAGE/free-ai-studio"
          # Ship the whole static tree (UI + bundled skills); a 3-file copy
          # silently dropped the skills from every installed release.
          cp -r app/static/. "dist/$STAGE/static/"
          cp README.md "dist/$STAGE/"
          cp app/LICENSE "dist/$STAGE/LICENSE"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"

      - name: Smoke the portable tarball (unpack, boot, report version)
        run: bash scripts/ci/smoke-package.sh dist/*.tar.gz

      # No .deb here: the deb job (ubuntu-22.04, headless) is the
      # distributable deb — a GUI-tree deb from ubuntu-latest carries a
      # glibc 2.39 dependency that refuses to install on 22.04 (this is what
      # broke the deb step in the v1.25.0 run), and its identical filename
      # races the deb job for the same release asset. Windowed binaries ship
      # as tarball + AppImage, exactly as the deb job's header says.

      - name: Build AppImage
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p AppDir/usr/bin AppDir/usr/share/sarthi-studio/static
          cp app/target/release/free-ai-studio AppDir/usr/bin/
          cp -r app/static/. AppDir/usr/share/sarthi-studio/static/
          # A full freedesktop tree: appimagetool runs `appstreamcli
          # validate-tree` over the AppDir, and that resolves the desktop entry
          # from usr/share/applications and the icon from the hicolor theme.
          # The root-level copies are what appimagetool itself requires.
          DESKTOP=io.github.sairajkhilariarch.SarthiStudio.desktop
          META=io.github.sairajkhilariarch.SarthiStudio.appdata.xml
          cp "app/packaging/$DESKTOP" "AppDir/$DESKTOP"
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/metainfo \
            AppDir/usr/share/icons/hicolor/256x256/apps
          cp "app/packaging/$DESKTOP" "AppDir/usr/share/applications/$DESKTOP"
          # validate-tree cross-checks the metainfo file name against the
          # component ID, which is why both carry the reverse-DNS name.
          cp "app/packaging/$META" "AppDir/usr/share/metainfo/$META"
          cp app/packaging/icons/sarthi-studio-256.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/sarthi-studio.png
          cp app/static/brand/app-icon.svg AppDir/sarthi-studio.svg
          # appimagetool does not generate AppRun; provide it explicitly so the
          # AppImage has an entry point that resolves usr/ relative to itself.
          ln -s usr/bin/free-ai-studio AppDir/AppRun
          # appimagetool also rejects the build without the desktop file's Icon
          # present as a PNG next to the .desktop plus a .DirIcon alias. The
          # PNG is committed so no SVG rasterizer is needed on the runner.
          cp app/packaging/icons/sarthi-studio-256.png AppDir/sarthi-studio.png
          ln -s sarthi-studio.png AppDir/.DirIcon
          # appimagetool aborts on a non-zero `appstreamcli validate-tree` and
          # prints only a one-line summary, which hides the actual finding.
          # Run the check ourselves first and emit each line as an annotation so
          # a failure here is diagnosable from the run page.
          command -v appstreamcli >/dev/null || sudo apt-get install -y appstream
          if ! report="$(appstreamcli validate-tree AppDir 2>&1)"; then
            printf '%s\n' "$report" | sed 's/^/::error::/'
            exit 1
          fi
          printf '%s\n' "$report"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "dist/sarthi-studio_${VERSION}_x86_64.AppImage"

      - name: Smoke the AppImage (extract, boot, report version)
        run: bash scripts/ci/smoke-package.sh dist/*.AppImage

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Validate artifact names and checksums
        run: bash scripts/ci/verify-artifacts.sh dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sarthi-studio-linux-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifacts to GitHub release
        if: needs.preflight.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: dist/*
          generate_release_notes: true

  windows:
    name: Build Windows release package
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The repo pins nightly for -Z threads and the cranelift dev backend;
      # release builds only need a stable-enough compiler, but the pinned
      # toolchain keeps CI identical to local builds.
      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # Git Bash ships on every Windows runner, so the same parser runs here
      # instead of a second regex that can drift from the Linux/macOS one.
      - name: Read package version
        id: meta
        run: |
          $version = (bash scripts/ci/version.sh app/Cargo.toml).Trim()
          if (-not $version) { throw "version extraction returned an empty string" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release binary and run tests
        working-directory: app
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $stage = "dist/sarthi-studio_${version}_windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/static" | Out-Null
          Copy-Item app/target/release/free-ai-studio.exe "$stage/free-ai-studio.exe"
          Copy-Item app/static/* "$stage/static/" -Recurse -Force
          Copy-Item README.md, app/LICENSE "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/sarthi-studio_${version}_windows-x86_64.zip" -Force
          # The staged tree stays: the MSI below installs the same payload.

      # Git Bash ships on every Windows runner, so the same smoke script runs
      # here and on Linux/macOS instead of a PowerShell second implementation.
      - name: Smoke the packaged zip (unpack, boot, report version)
        shell: bash
        run: bash scripts/ci/smoke-package.sh dist/*.zip

      # A zip asks the user to unpack files; an MSI is one product in
      # Add/Remove Programs with a version and an uninstall.
      - name: Install the WiX packager
        run: dotnet tool install wix --version 5.* --tool-path .tmp/wix5

      - name: Build the MSI installer
        shell: bash
        run: |
          set -eu
          version="${{ steps.meta.outputs.version }}"
          bash scripts/ci/build-windows-msi.sh "dist/sarthi-studio_${version}_windows-x86_64" "$version" dist

      - name: Smoke the MSI (administrative install, boot, report version)
        shell: bash
        run: bash scripts/ci/smoke-package.sh dist/*.msi

      - name: Drop the staging tree
        run: Remove-Item -Recurse -Force "dist/sarthi-studio_${{ steps.meta.outputs.version }}_windows-x86_64"

      - name: Validate artifact names
        run: bash scripts/ci/verify-artifacts.sh dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarthi-studio-windows-${{ steps.meta.outputs.version }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows artifact to GitHub release
        if: needs.preflight.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.msi

  macos:
    # macOS ships a portable, UNSIGNED universal (arm64 + x86_64) tarball:
    # binary + full static tree + license, same runtime layout as the Linux
    # tarball (the binary resolves its UI from static/ next to itself), plus a
    # `Sarthi Studio.app` bundle built from the same tree, where the binary
    # lives in Contents/MacOS and the UI in Contents/Resources/static. No dmg:
    # unsigned .dmg files get worse Gatekeeper treatment than a zip.
    # No codesign or notarization (no available credentials), so Gatekeeper
    # asks the user to right-click -> Open on first launch - documented in
    # README. The headless smoke below proves the merged binary actually
    # boots and serves HTTP, not merely that lipo succeeded.
    name: Build macOS release package (universal, unsigned)
    # GitHub's own annotation on run 41869072420 was "The job was not acquired
    # by Runner of type hosted even after multiple attempts" plus notices about
    # macOS arm64 capacity: macos-latest is an arm64 image, so this job sat in
    # the queue until the run was cancelled. macos-15-intel is the Intel image
    # (still supported), and the job cross-builds the aarch64 slice anyway, so
    # the universal binary is unchanged.
    needs: preflight
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      # Both slices, whichever host arch the runner has: on an Intel runner the
      # aarch64 std is the one that is missing (that is what failed the v1.26.5
      # job with exit 101), on arm64 the x86_64 one is.
      - name: Add both targets for the universal merge
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # One parser on every OS (scripts/ci/version.sh): it strips CR/LF/tab and
      # refuses an empty or malformed version. A raw CR here is what produced
      # unusable artifact filenames in the v1.26.0/v1.26.1 runs.
      - name: Read package version
        id: meta
        run: |
          set -eu
          version="$(bash scripts/ci/version.sh app/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binaries and run tests
        working-directory: app
        run: |
          set -eu
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo test --locked

      - name: Stage the tree and merge the universal binary
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="dist/sarthi-studio_${VERSION}_macos-universal"
          mkdir -p "$STAGE/static"
          lipo -create \
            app/target/aarch64-apple-darwin/release/free-ai-studio \
            app/target/x86_64-apple-darwin/release/free-ai-studio \
            -output "$STAGE/free-ai-studio"
          cp -r app/static/. "$STAGE/static/"
          cp README.md "$STAGE/"
          cp app/LICENSE "$STAGE/LICENSE"
          echo "$STAGE" > dist/stage-name.txt

      - name: Verify the universal binary carries both arches
        run: |
          set -eu
          STAGE="$(cat dist/stage-name.txt)"
          arches="$(lipo -info "$STAGE/free-ai-studio")"
          echo "$arches"
          echo "$arches" | grep -q arm64 || { echo "ERROR: arm64 slice missing"; exit 1; }
          echo "$arches" | grep -q x86_64 || { echo "ERROR: x86_64 slice missing"; exit 1; }

      - name: Smoke the universal binary (headless server answers HTTP)
        run: |
          set -euo pipefail
          STAGE="$(cat dist/stage-name.txt)"
          FREE_AI_STUDIO_PORT=32987 "$STAGE/free-ai-studio" --headless &
          PID=$!
          clean_up() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap clean_up EXIT
          smoke=0
          for _ in $(seq 1 40); do
            if curl -fsS -o /dev/null "http://127.0.0.1:32987/"; then smoke=1; break; fi
            sleep 0.5
          done
          if [ "$smoke" = "1" ]; then echo "headless server answered the smoke request"; else echo "ERROR: headless server did not answer HTTP"; exit 1; fi

      # A .app is what a macOS user double-clicks; the tarball stays as the
      # no-bundle fallback. Both are built from the same staged tree.
      - name: Build the macOS application bundle (.app)
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          bash scripts/ci/bundle-macos-app.sh "$(cat dist/stage-name.txt)" "$VERSION" dist

      - name: Package portable tarball
        run: |
          set -eu
          STAGE="$(cat dist/stage-name.txt)"
          tar -C dist -czf "${STAGE}.tar.gz" "$(basename "$STAGE")"
          rm -rf "$STAGE" dist/stage-name.txt

      - name: Smoke the packaged tarball (unpack, boot, report version)
        run: bash scripts/ci/smoke-package.sh dist/*.tar.gz

      - name: Smoke the app bundle (unpack, boot, report version)
        run: bash scripts/ci/smoke-package.sh dist/*.app.zip

      - name: Validate artifact names
        run: bash scripts/ci/verify-artifacts.sh dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarthi-studio-macos-${{ steps.meta.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.app.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach macOS artifact to GitHub release
        if: needs.preflight.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.app.zip

  vscode-extension:
    name: Build VS Code extension (.vsix)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install, typecheck, test, and package
        working-directory: vscode-extension
        run: |
          set -eu
          npm ci
          npx tsc --noEmit
          npm test
          mkdir -p ../dist
          npx vsce package --no-dependencies -o ../dist/free-ai-studio-vscode.vsix

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-studio-vscode
          path: dist/free-ai-studio-vscode.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Attach extension to GitHub release
        if: needs.preflight.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: dist/free-ai-studio-vscode.vsix

  android:
    name: Build Android release APK and AAB (signed)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Releases sign with the Android Gradle plugin's auto-created debug
      # keystore so the APK installs on a device without committing a secret.
      - name: Assemble release APK and AAB (R8, debug-signed)
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Stage Android artifacts
        run: |
          set -eu
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release*.apk dist/free-ai-studio-android.apk
          cp android/app/build/outputs/bundle/release/app-release*.aab dist/free-ai-studio-android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-studio-android
          path: |
            dist/free-ai-studio-android.apk
            dist/free-ai-studio-android.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach Android artifacts to GitHub release
        if: needs.preflight.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: |
            dist/free-ai-studio-android.apk
            dist/free-ai-studio-android.aab

  verify-release:
    # A green build is not a shipped release until the assets are actually on
    # the tag. This catches the failure mode that produced v1.62.0-v1.71.0:
    # releases with zero assets because no build was ever attached.
    name: Verify release assets
    needs: [preflight, deb, release, windows, macos, vscode-extension, android]
    if: always() && needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify every expected asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/ci/verify-release.sh "$RELEASE_TAG" "$RELEASE_VERSION"
