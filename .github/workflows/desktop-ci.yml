name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustc-codegen-cranelift

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      # The app's default "gui" feature links Tauri, which needs GTK and
      # webkit2gtk development libraries at build time. These are not
      # preinstalled on ubuntu runners.
      - name: Install Tauri system dependencies
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Verify desktop project layout
        run: |
          set -eu
          test -f app/Cargo.toml
          test -f app/Cargo.lock
          test -f app/src/main.rs
          test -f app/static/index.html
          test -f app/static/app.js
          test -f app/static/styles.css
          test -f app/packaging/free-ai-suite.desktop
          test -f app/packaging/icons/free-ai-suite.svg

      - name: Build debug binary
        working-directory: app
        run: cargo build --locked

      - name: Run desktop tests
        working-directory: app
        run: cargo test --locked

      - name: Run clippy
        working-directory: app
        run: cargo clippy --locked --all-targets -- -D warnings

  macos:
    # Keep macOS compiling: the release pipeline merges a universal binary,
    # and an Intel-only or macOS-only source break fails there rather than
    # here. The GitHub runner's system WebKit satisfies Tauri's links.
    name: Test and build desktop (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build debug binary
        working-directory: app
        run: cargo build --locked

      - name: Run desktop tests
        working-directory: app
        run: cargo test --locked
