name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustc-codegen-cranelift

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      # The app's default "gui" feature links Tauri, which needs GTK and
      # webkit2gtk development libraries at build time. These are not
      # preinstalled on ubuntu runners.
      - name: Install Tauri system dependencies
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Verify desktop project layout
        run: |
          set -eu
          test -f app/Cargo.toml
          test -f app/Cargo.lock
          test -f app/src/main.rs
          test -f app/static/index.html
          test -f app/static/app.js
          test -f app/static/styles.css
          test -f app/packaging/io.github.sairajkhilariarch.SarthiStudio.desktop
          test -f app/packaging/io.github.sairajkhilariarch.SarthiStudio.appdata.xml
          test -f app/static/brand/app-icon.svg
          test -f app/packaging/windows/installer.wxs

      # Pipeline regressions (v1.26.0/v1.26.1 shipped no assets because of a CR
      # in an artifact filename) are caught here on every push, not only on a tag.
      - name: Test release version parsing and artifact gate
        run: bash scripts/ci/test-version.sh

      # A release job that built nothing, or half of its promised files, must
      # fail here rather than publish an empty directory; this drives the gate
      # over fixture directories that need no packaging tools.
      - name: Test the artifact gate
        run: bash scripts/ci/test-artifacts.sh

      # The AppStream component and desktop entry are packaged into the .deb and
      # the AppImage; a stale release version there is valid XML, so only this
      # check catches it.
      - name: Test the Linux package metadata
        run: bash scripts/ci/test-linux-metadata.sh

      # A release with zero assets looked successful on GitHub. The gate reads a
      # fixture release over loopback and must reject a missing artifact.
      - name: Test the release asset gate
        run: bash scripts/ci/test-release.sh

      # The static UI has no build step, so nothing else catches a broken pure
      # helper: these run the real app.js in a browser-free harness.
      - name: Run frontend tests
        run: bash scripts/ci/test-frontend.sh

      # The macOS .app packager decides what a macOS user double-clicks, and it
      # is plain shell so it runs here on every push, not only in a release.
      - name: Test the macOS bundle packager
        run: bash scripts/ci/test-bundle.sh

      # rustfmt ships in the pinned toolchain and the whole tree is formatted, so
      # an unformatted change fails on the push instead of making every later
      # diff noisy.
      - name: Check Rust formatting
        working-directory: app
        run: cargo fmt --check

      - name: Build debug binary
        working-directory: app
        run: cargo build --locked

      - name: Run desktop tests
        working-directory: app
        run: cargo test --locked

      - name: Run clippy
        working-directory: app
        run: cargo clippy --locked --all-targets -- -D warnings

      # Process-level: the real binary, a scratch home, the mock provider, and a
      # restart. Reuses the debug binary built above.
      - name: Run end-to-end smoke
        run: bash scripts/ci/test-e2e.sh

  windows:
    # Windows was only ever built on a tag: a source break could reach a release
    # before any test ran there. WebView2 and the MSVC toolchain ship on the
    # runner, and `.cargo/config.toml` already scopes mold and `-Z threads` to
    # Linux, so the default `gui` feature links without extra setup. Linux keeps
    # clippy and the end-to-end smoke; this job is build + tests.
    name: Test and build desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build debug binary
        working-directory: app
        run: cargo build --locked

      - name: Run desktop tests
        working-directory: app
        run: cargo test --locked

      # The MSI packager is what a Windows user installs and uninstalls, so its
      # payload and refusals are checked here. WiX comes from nuget as a dotnet
      # tool; the packager finds it under .tmp/wix without touching PATH.
      - name: Install the WiX packager
        run: dotnet tool install wix --version 5.* --tool-path .tmp/wix5

      - name: Test the Windows MSI packager
        shell: bash
        run: bash scripts/ci/test-installer.sh

  macos:
    # Keep macOS compiling: the release pipeline merges a universal binary,
    # and an Intel-only or macOS-only source break fails there rather than
    # here. The GitHub runner's system WebKit satisfies Tauri's links.
    name: Test and build desktop (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build debug binary
        working-directory: app
        run: cargo build --locked

      - name: Run desktop tests
        working-directory: app
        run: cargo test --locked
