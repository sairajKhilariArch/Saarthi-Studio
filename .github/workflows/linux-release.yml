name: Linux Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux release packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
    steps:
      - name: Cancel in-progress runs
        if: github.event_name == 'push'
        uses: styfle/cancel-workflow-action@0.11.0

      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up cached Rust toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install mold linker
        run: |
          if ! command -v mold >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mold
          fi

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Read package version
        id: meta
        run: echo "version=$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' app/Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Build release binary and run tests
        working-directory: app
        timeout-minutes: 30
        run: |
          set -eu
          cargo build --release --locked
          cargo test --locked

      - name: Build portable tarball
        timeout-minutes: 10
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="free-ai-suite_${VERSION}_linux-x86_64"
          mkdir -p "dist/$STAGE/static"
          cp app/target/release/free-ai-studio "dist/$STAGE/free-ai-studio"
          cp app/static/index.html app/static/app.js app/static/styles.css "dist/$STAGE/static/"
          cp README.md "dist/$STAGE/"
          cp app/LICENSE "dist/$STAGE/LICENSE"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"

      - name: Build .deb package
        timeout-minutes: 10
        run: |
          set -eu
          cargo install cargo-deb --locked
          cd app
          cargo deb --locked
          cp target/debian/*.deb ../dist/

      - name: Build AppImage
        timeout-minutes: 10
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p AppDir/usr/bin AppDir/usr/share/free-ai-suite/static
          cp app/target/release/free-ai-studio AppDir/usr/bin/
          cp app/static/index.html app/static/app.js app/static/styles.css AppDir/usr/share/free-ai-suite/static/
          cp app/packaging/free-ai-suite.desktop AppDir/free-ai-suite.desktop
          cp app/packaging/icons/free-ai-suite.svg AppDir/free-ai-suite.svg
          ln -s usr/bin/free-ai-studio AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "dist/free-ai-suite_${VERSION}_x86_64.AppImage"

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-suite-linux-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach Linux artifact to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true