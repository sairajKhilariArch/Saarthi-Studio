name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release package
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
    steps:
      - name: Cancel in-progress runs
        if: github.event_name == 'push'
        uses: styfle/cancel-workflow-action@0.11.0

      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up cached Rust toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/
          key: windows-cargo-${{ hashFiles('app/Cargo.toml') }}
          restore-keys: |
            windows-cargo-

      - name: Install Rust and target for Windows cross-compilation
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          "$env:USERPROFILE\.rustup\bin\rustup.exe" target add x86_64-pc-windows-msvc

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: windows-cargo-registry-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            windows-cargo-registry-

      - name: Read package version
        id: meta
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $version | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build release binary and run tests
        working-directory: app
        timeout-minutes: 30
        run: |
          cargo build --release --locked
          cargo test --locked

      - name: Package portable zip
        timeout-minutes: 10
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $stage = "dist/free-ai-suite_${version}_windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/static" | Out-Null
          Copy-Item app/target/release/free-ai-studio.exe "$stage/free-ai-studio.exe"
          Copy-Item app/static/index.html, app/static/app.js, app/static/styles.css "$stage/static/"
          Copy-Item README.md, app/LICENSE "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/free-ai-suite_${version}_windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-suite-windows-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows artifact to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip