name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows release package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up nightly Rust (see rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Read package version
        id: meta
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          "$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release binary and run tests
        working-directory: app
        run: |
          cargo build --release --locked
          cargo test --locked

      - name: Package portable zip
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $stage = "dist/free-ai-suite_${version}_windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/static" | Out-Null
          Copy-Item app/target/release/free-ai-studio.exe "$stage/free-ai-studio.exe"
          Copy-Item app/static/index.html, app/static/app.js, app/static/styles.css "$stage/static/"
          Copy-Item README.md, app/LICENSE "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/free-ai-suite_${version}_windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-ai-suite-windows-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach Windows artifact to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip