name: Build Saarthi Studio Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android
    paths:
      - 'app/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'BUILDING.md'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android project layout
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/saarthi/studio/MainActivity.java

      - name: Check patch whitespace
        run: git show --check --oneline HEAD

      - name: Run Android unit-test task, lint, and debug build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-studio-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
