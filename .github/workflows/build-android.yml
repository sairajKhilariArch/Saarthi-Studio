name: Build Saarthi Studio Android APK

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - 'app/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'BUILDING.md'
      - 'UPGRADE-GUIDE-1.11.1.md'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'
  pull_request:
    # PR branch filters apply to the BASE branch. The active Android PR targets main.
    branches: [main, android]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, build, and verify Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project layout
        run: |
          set -eu
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/saarthi/studio/MainActivity.java
          test -f app/src/main/java/com/saarthi/studio/ChatDatabase.java
          test -f app/src/main/java/com/saarthi/studio/DatabaseMigrations.java
          test -f app/src/test/java/com/saarthi/studio/BackupPolicyTest.java
          test -f app/src/androidTest/java/com/saarthi/studio/DatabaseMigrationInstrumentedTest.java
          test -f app/src/androidTest/java/com/saarthi/studio/ChatHistoryPagingInstrumentedTest.java
          test -f app/src/androidTest/java/com/saarthi/studio/BackupRestoreInstrumentedTest.java
          test -f app/src/androidTest/java/com/saarthi/studio/AppLaunchInstrumentedTest.java

      - name: Check committed whitespace
        id: whitespace
        continue-on-error: true
        run: git show --check --oneline HEAD

      - name: Run JVM regression tests
        id: unit
        continue-on-error: true
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android lint
        id: lint
        continue-on-error: true
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Print Android lint report
        if: always()
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then cat "$REPORT"; else echo "Android lint text report was not generated."; fi

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Assemble instrumentation APK
        id: assemble_tests
        if: always() && steps.assemble.outcome == 'success'
        continue-on-error: true
        run: gradle --no-daemon --stacktrace assembleDebugAndroidTest

      - name: Upload debug APK artifact
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-studio-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-studio-android-lint-report
          path: |
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30

      - name: Run Android instrumentation tests
        id: instrumented
        if: always() && steps.assemble.outcome == 'success' && steps.assemble_tests.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set +e
            WORKSPACE="${GITHUB_WORKSPACE:-$PWD}"
            DIAG_DIR="$WORKSPACE/ci-diagnostics"
            mkdir -p "$DIAG_DIR"
            printf 'Workspace: %s\nWorking directory: %s\n' "$WORKSPACE" "$PWD" > "$DIAG_DIR/environment.txt"

            # Start with a clean device log and preserve it before the emulator is removed.
            adb logcat -c >/dev/null 2>&1 || true

            adb install -r "$WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" > "$DIAG_DIR/install-app.log" 2>&1
            APP_INSTALL_EXIT=$?
            adb install -r -t "$WORKSPACE/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" > "$DIAG_DIR/install-tests.log" 2>&1
            TEST_INSTALL_EXIT=$?

            cat "$DIAG_DIR/install-app.log"
            cat "$DIAG_DIR/install-tests.log"

            TEST_EXIT=0
            if [ "$APP_INSTALL_EXIT" -ne 0 ] || [ "$TEST_INSTALL_EXIT" -ne 0 ]; then
              echo 'Installing the app or instrumentation APK failed.' | tee "$DIAG_DIR/test-summary.txt"
              TEST_EXIT=1
            else
              # Bypass the Gradle UTP wrapper and invoke the same AndroidJUnitRunner directly.
              # am instrument itself can exit zero even when tests fail, so parse runner status markers.
              adb shell am instrument -w -r com.saarthi.studio.test/androidx.test.runner.AndroidJUnitRunner > "$DIAG_DIR/instrumentation.log" 2>&1
              INSTRUMENT_EXIT=$?
              cat "$DIAG_DIR/instrumentation.log"

              if [ "$INSTRUMENT_EXIT" -ne 0 ]; then
                echo "adb instrumentation command failed with exit code $INSTRUMENT_EXIT." | tee "$DIAG_DIR/test-summary.txt"
                TEST_EXIT=1
              elif grep -Eq '^INSTRUMENTATION_STATUS_CODE: -(1|2)$|^INSTRUMENTATION_RESULT: shortMsg=Process crashed|^INSTRUMENTATION_FAILED' "$DIAG_DIR/instrumentation.log"; then
                echo 'AndroidJUnitRunner reported a test failure or process crash.' | tee "$DIAG_DIR/test-summary.txt"
                TEST_EXIT=1
              elif ! grep -Eq '^INSTRUMENTATION_STATUS: numtests=[1-9][0-9]*$' "$DIAG_DIR/instrumentation.log"; then
                echo 'AndroidJUnitRunner did not report any tests; treating this as a failure.' | tee "$DIAG_DIR/test-summary.txt"
                TEST_EXIT=1
              elif ! grep -q '^INSTRUMENTATION_CODE: -1$' "$DIAG_DIR/instrumentation.log"; then
                echo 'AndroidJUnitRunner did not report normal completion.' | tee "$DIAG_DIR/test-summary.txt"
                TEST_EXIT=1
              else
                echo 'AndroidJUnitRunner completed the test suite without failure markers.' | tee "$DIAG_DIR/test-summary.txt"
              fi
            fi

            adb logcat -b all -d -v threadtime > "$DIAG_DIR/logcat.txt" 2>&1 || true
            adb shell dumpsys activity processes > "$DIAG_DIR/activity-processes.txt" 2>&1 || true
            adb shell dumpsys meminfo > "$DIAG_DIR/meminfo.txt" 2>&1 || true
            adb shell getprop > "$DIAG_DIR/getprop.txt" 2>&1 || true
            find "$WORKSPACE/app/build/outputs" -maxdepth 7 -type f \( -name '*.xml' -o -name '*.txt' -o -name '*.log' \) -print -exec cp --parents {} "$DIAG_DIR/" \; || true

            echo 'Recent Android runtime errors:'
            grep -Ei 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_FAILED|Process: com\.saarthi|Fatal signal|Permission Denial|lowmemorykiller' "$DIAG_DIR/logcat.txt" | tail -n 200 || true
            echo 'Diagnostic files captured:'
            find "$DIAG_DIR" -maxdepth 8 -type f -printf '%p (%s bytes)\n' || true
            exit "$TEST_EXIT"

      - name: Upload Android test reports and crash diagnostics
        if: always() && steps.instrumented.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-studio-android-failure-diagnostics
          path: |
            ${{ github.workspace }}/ci-diagnostics/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce release validation gate
        if: always()
        env:
          WHITESPACE_OUTCOME: ${{ steps.whitespace.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          ASSEMBLE_TESTS_OUTCOME: ${{ steps.assemble_tests.outcome }}
          INSTRUMENTED_OUTCOME: ${{ steps.instrumented.outcome }}
        run: |
          failed=0
          for result in "$WHITESPACE_OUTCOME" "$UNIT_OUTCOME" "$LINT_OUTCOME" "$ASSEMBLE_OUTCOME" "$ASSEMBLE_TESTS_OUTCOME" "$INSTRUMENTED_OUTCOME"; do
            if [ "$result" != "success" ]; then
              echo "Validation step failed: $result"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Android validation failed. Inspect the test and diagnostics artifacts above."
            exit 1
          fi
          echo "All required Android validation steps passed."
