[package]
name = "free-ai-studio"
version = "3.42.0"
edition = "2021"
rust-version = "1.80"
description = "Sarthi Studio — local-first AI chat and coding workspace for FreeLLMAPI"
license = "MIT"

[dependencies]
axum = "=0.7.9"
axum-server = { version = "=0.7.3", default-features = false, features = ["tls-rustls"] }
# Streaming chat: reqwest's byte stream is folded into SSE frames by hand.
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
getrandom = "=0.2.15"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.9"
subtle = "=2.6.1"
# Verified native installs: unpack exactly the archive the checksum covers.
# gzip is needed for this app's own Linux/macOS release tarballs; the pure-Rust
# backend keeps the build free of a C toolchain.
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
tokio = { version = "=1.43.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "process", "io-util"] }
# Broadcast wrappers feed the live thread-mirroring SSE bus.
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "=1.12.1", features = ["v4"] }
# Sandboxed extension execution (ADR 0001). A pure-Rust interpreter, pinned so a
# transitive update cannot silently change the sandbox's semantics.
wasmi = "=0.31.2"
# Real PTY terminals for the bottom panel (ConPTY on Windows, unix pty).
portable-pty = "0.9"
# Desktop application window (Tauri v2). Disable with --no-default-features
# for a headless server-only build.
# Pinned: tauri 2.11 builds against an older tauri-runtime monitor API and
# breaks when Cargo picks runtime 2.12. Keep the whole 2.12 line together.
tauri = { version = "=2.12.5", optional = true }
# Secrets in the OS credential store, not config.json (Phase 10). One crate,
# three platform stores: Windows Credential Manager, macOS Keychain, Linux
# Secret Service (sync) — maintained by the RustOS team lineage and the
# de facto standard for this. Tests and dev runs use the built-in mock
# store via FREE_AI_STUDIO_KEYCHAIN in ../.cargo/config.toml.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = ["gui"]
# Native application window around the local UI. Off => server-only binary.
gui = ["dep:tauri"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Packaging metadata for `cargo deb` (used by the desktop release workflow).
# The binary locates its UI via <exe dir>/../share/sarthi-studio/static at
# runtime, so the deb asset paths below are load-bearing.
#
# The released deb is built on ubuntu-22.04 with `cargo build
# --no-default-features` first (headless: no GTK/webkit deps, glibc 2.35),
# then `cargo deb --no-build` packages that binary — so $auto resolves to
# bare-minimum libc and installs on 22.04+. The desktop entry launches the
# headless binary with --browser; windowed builds ship as the tarball and
# AppImage from the same release. User data lives in ~/.config and
# ~/.local/share (never package paths), so per-user data survive updates.
[package.metadata.deb]
maintainer = "SAIRAJ KHILARI <sairajkhilari191918110+github1@gmail.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """Sarthi Studio is a local-first AI chat and coding workspace. It runs a
loopback-only HTTP service that serves a browser UI (opened automatically by
this package's launcher) and routes chat requests to a self-hosted FreeLLMAPI
endpoint. Upgrades replace only the binaries and UI under /usr; conversations,
projects, settings and credentials in the user's home are preserved."""
assets = [
    ["target/release/free-ai-studio", "usr/bin/free-ai-studio", "755"],
    ["static/index.html", "usr/share/sarthi-studio/static/index.html", "644"],
    ["static/app.js", "usr/share/sarthi-studio/static/app.js", "644"],
    ["static/styles.css", "usr/share/sarthi-studio/static/styles.css", "644"],
    ["static/skills/code-review/SKILL.md", "usr/share/sarthi-studio/static/skills/code-review/SKILL.md", "644"],
    ["static/skills/debug/SKILL.md", "usr/share/sarthi-studio/static/skills/debug/SKILL.md", "644"],
    ["static/skills/tests/SKILL.md", "usr/share/sarthi-studio/static/skills/tests/SKILL.md", "644"],
    # The desktop entry and its AppStream metadata carry the reverse-DNS name:
    # appstreamcli rejects a non-RDNS component ID, and the two file names must
    # match that ID or validate-tree reports a mismatch.
    ["packaging/io.github.sairajkhilariarch.SarthiStudio.desktop", "usr/share/applications/io.github.sairajkhilariarch.SarthiStudio.desktop", "644"],
    ["packaging/io.github.sairajkhilariarch.SarthiStudio.appdata.xml", "usr/share/metainfo/io.github.sairajkhilariarch.SarthiStudio.appdata.xml", "644"],
    ["static/brand/app-icon.svg", "usr/share/icons/hicolor/scalable/apps/sarthi-studio.svg", "644"],
]
[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
# Compiles the WAT modules the extension runner tests execute.
wat = "1"
